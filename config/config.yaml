# Parameter gespiegelt aus REGELWERK.md v0.8 (2026-09-11).
# Quelle der Wahrheit ist das REGELWERK im Projektordner — Regeländerungen nur als neue
# Version dort plus Eintrag in ENTSCHEIDUNGEN.md, danach hier nachziehen.

capital:
  total_usd: 10000        # Regelwerk §7
  core_usd: 7500          # Kern-Topf (Alpaca Paper)
  satellite_usd: 2500     # Satellit-Topf (eToro Demo)

core:                     # Regelwerk §2
  instrument: SPY
  cash_instrument: BIL
  sma_months: 10
  schedule: first_trading_day_of_month

satellite:                # Regelwerk §3 (v0.6: Signal nur aus echten Tradern)
  top_k: 50                       # Signal-Kohorte: echte Trader (type=trader)
  smart_portfolio_comparison_k: 20  # Vergleichskohorte, speist NICHT das Signal
  ranking_query:          # Abrufparameter (Analyse-Phase; Auswahlregel wird im Backtest verfeinert)
    period: LastTwoYears  # 2-Jahres-Fenster ~ Proxy für >=24 Monate Historie
    sort: "-copiers"
    pages: 3              # 3 x 100 Zeilen holen, dann clientseitig filtern (genug fuer 50 Trader + 20 SPs)
    page_size: 100
    risk_score_max: 6
    copiers_min: 1
    max_drawdown_pct: 20  # clientseitig auf peakToValley angewendet
  quality_filter:
    min_history_months: 24
    max_drawdown_pct: 20
    max_risk_score: 6
    require_active_copiers: true
  consensus:
    min_traders_n: 5
    window_trading_days: 3        # NYSE-Handelstage (exchange_calendars XNYS), Fenster endet am Snapshot-Tag
    min_weight_pct: 0.1           # Mindest-Gesamtgewicht je Trader/Instrument (Summe investmentPct) gegen Staub-Positionen; Startwert 2026-09-09
    counting_variant: A           # A = nur erster Kauf zaehlt (Nachkaeufe nicht); B/C nur im Backtest
  universe:                       # Regelwerk §3: US-Aktien/ETFs, keine CFD-only-Instrumente
    type_ids: [5, 6]              # eToro typeId: 5 Aktie, 6 ETF (10 Krypto, 1 Forex, 4 Index-CFD raus)
    exchange_ids: [4, 5]          # eToro exchangeId: 4 NASDAQ, 5 NYSE
  excluded_broad_index_etfs: [SPY, VOO, IVV, VTI, QQQ, IWM]
  excluded_broad_index_etf_names:  # instruments.json hat keine Symbole -> Namensmuster (case-insensitive)
    - "S&P 500"
    - "QQQ"
    - "Nasdaq 100"
    - "Total Stock Market"
    - "Russell 2000"

risk:                     # Regelwerk §4–§6
  risk_per_trade_pct: 1.0
  max_position_pct: 10.0
  max_open_positions: 10
  max_sector_pct: 30.0
  atr_period: 14
  stop_atr_mult: 2.5
  trailing_atr_mult: 3.0
  time_stop_trading_days: 30
  circuit_breaker_drawdown_pct: 12.0

etoro:
  base_url: https://public-api.etoro.com
  mode: demo              # NUR demo, bis Michel Echtgeld ausdrücklich freigibt
  rate_limit_per_60s: 60
  # Endpunkt für den Smoke-Test (verifiziert 2026-09-06); weitere Pfade: api-portal.etoro.com
  smoke_endpoint: /api/v1/market-data/instruments

alpaca:
  base_url: https://paper-api.alpaca.markets
