[project]
name = "trading-bot"
version = "0.1.0"
description = "Paper-Trading-Bot: Faber-SMA-Kern (Alpaca Paper) + eToro-Konsens-Satellit (eToro Demo)"
requires-python = ">=3.12"
dependencies = [
    "exchange_calendars>=4.5",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
