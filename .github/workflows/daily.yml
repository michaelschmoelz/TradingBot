name: daily

on:
  workflow_dispatch: {}
  # Cron erst aktivieren, wenn der Bot steht (1x/Handelstag nach US-Schluss, Zeiten in UTC):
  # schedule:
  #   - cron: "30 21 * * 1-5"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Smoke-Test (Paper/Demo, keine Orders)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
        run: python scripts/smoke_test.py
