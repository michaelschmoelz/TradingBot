name: daily

on:
  workflow_dispatch: {}
  schedule:
    # Taeglich nach US-Boersenschluss (21:30 UTC = 23:30 dt. Sommerzeit), Mo-Fr
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install httpx python-dotenv PyYAML exchange_calendars
      - name: Unit-Tests (Signal-Logik)
        run: pip install pytest && python -m pytest -q tests
      - name: Smoke-Test (Paper/Demo, keine Orders)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
        run: python scripts/smoke_test.py
      - name: Tageslauf (Kohorte, Live-Portfolios nur im Speicher, abgeleitete Daten + Reports)
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
        run: |
          python scripts/daily_run.py
          { echo '```'; cat data/reports/$(date -u +%F)-overlap.txt; echo; cat data/reports/$(date -u +%F)-entries.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Tagesdaten + Reports committen
        run: |
          git config user.name "trading-bot-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily data/reports
          git diff --cached --quiet && echo "Keine Aenderungen" || git commit -m "Tagesdaten + Reports $(date -u +%F) [Actions]"
          git push
